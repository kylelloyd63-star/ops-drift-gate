name: Bootstrap npm 0.1.1 staging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v0.1.1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify immutable release candidate
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "2bef6898682cf53a8d716dd982114393ed346922"
          npm run check
          npm run package-check
          npm pack --ignore-scripts >/dev/null
          echo "1dcc0559a76d8e545c213fea6e8a8ab698d03beb2ba316f8d9ac37a0ecd4648b  ops-drift-gate-0.1.1.tgz" | sha256sum --check --strict
          rm ops-drift-gate-0.1.1.tgz
      - name: Stage package only
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: npm stage publish --access public
